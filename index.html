<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Djamal Eddine Ouikene - CV</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-377WCB5SH9"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-377WCB5SH9');
    </script>
</head>

<body>
    <div id="cv-content" class="loading">Loading...</div>

    <script>
        async function loadCV() {
            try {
                const response = await fetch('/data/cv.json');
                const data = await response.json();
                renderCV(data);  // Remove await as renderCV is not async
                document.body.classList.add('loaded');
                // Remove loading class after render
                document.getElementById('cv-content').classList.remove('loading');
            } catch (error) {
                console.error('Error loading CV data:', error);
                document.getElementById('cv-content').innerHTML = 'Error loading CV data';
            }
        }

        function renderCV(data) {
            const content = document.getElementById('cv-content');

            content.innerHTML = `
                <div class="profile-header">
                    <div class="profile-info">
                        <h1>${data.personalInfo.name}</h1>
                        <div class="contact">
                            <p>${data.personalInfo.title}</p>
                            <p>
                                <i class="fas fa-map-marker-alt"></i> ${data.personalInfo.location} | 
                                <i class="fas fa-phone"></i> <a href="tel:${data.personalInfo.phone}">${data.personalInfo.phone}</a> | 
                                <i class="fas fa-envelope"></i> <a href="mailto:${data.personalInfo.email}">${data.personalInfo.email}</a> | 
                                <i class="fab fa-github"></i> <a href="${data.personalInfo.github}" target="_blank">douikene</a> |
                                <i class="fab fa-linkedin"></i> <a href="https://www.linkedin.com/in/douikene/" target="_blank">douikene</a> |
                                <i class="fas fa-globe"></i> <a href="${data.personalInfo.url}" target="_blank">douikene</a>
                            </p>
                            <a href="#" class="download-btn" onclick="printCV(); return false;">
                                <i class="fas fa-download"></i> Download CV
                            </a>
                        </div>
                    </div>
                    <div class="profile-image">
                        <img src="${data.personalInfo.picture}" alt="${data.personalInfo.name}">
                    </div>
                </div>

                <section>
                    <h2>Professional Summary</h2>
                    <p>${data.professionalSummary}</p>
                </section>

                <section>
                    <h2>Professional Experience</h2>
                    ${renderExperience(data.experience)}
                </section>

                <section>
                    <h2>Education & Certifications</h2>
                    <ul>
                        ${data.education.map(edu => `
                            <li><strong>${edu.degree}</strong> – ${edu.institution} (${edu.year})</li>
                        `).join('')}
                        <li>${data.certifications.join(', ')}</li>
                    </ul>
                </section>

                <section>
                    <h2>Technical Skills</h2>
                    <ul>
                        ${Object.entries(data.skills).map(([category, skills]) => `
                            <li><strong>${formatCategory(category)}:</strong> ${skills.join(', ')}</li>
                        `).join('')}
                    </ul>
                </section>

                <section>
                    <h2>Languages</h2>
                    <p>${data.languages.map(l => `${l.language} (${l.level})`).join(', ')}</p>
                </section>

                <section>
                    <h2>Personal Interests</h2>
                    <ul>
                        ${data.interests.map(interest => `<li>${interest}</li>`).join('')}
                    </ul>
                </section>

            `;

            initCVCopilot();

            // Add this after content is rendered
            const downloadBtn = document.querySelector('.download-btn');
            if (downloadBtn) {
                downloadBtn.onclick = function (e) {
                    e.preventDefault();
                    printCV();
                };
            }
        }

        function renderExperience(experience) {
            return experience.map(company => `
                <h3>${company.company} (${company.location})</h3>
                ${company.roles.map(role => `
                    <p><strong>${role.title}</strong> (${role.period})</p>
                    <ul>
                        ${role.responsibilities.map(resp => `<li>${resp}</li>`).join('')}
                    </ul>
                `).join('')}
            `).join('');
        }

        function formatCategory(category) {
            return category
                .replace(/([A-Z])/g, ' $1')
                .replace(/^./, str => str.toUpperCase())
                .trim();
        }

        function printCV() {
            if (document.body.classList.contains('loaded')) {
                window.print();
            } else {
                alert('Please wait for CV to load completely before printing.');
            }
        }
        function initCVCopilot() {
            const API_BASE = "https://my-cv-copilot-api.fly.dev";

            const elBox = document.getElementById("cvChatBox");
            const elInput = document.getElementById("cvInput");
            const elSend = document.getElementById("cvSend");
            const elClear = document.getElementById("cvClear");
            const elStatus = document.getElementById("cvStatus");

            // If widget not present, do nothing
            if (!elBox || !elInput || !elSend || !elClear || !elStatus) return;

            const storageKey = "mycvcopilot_chat_v1";
            let chat = [];

            function scrollToBottom() { elBox.scrollTop = elBox.scrollHeight; }

            function render() {
                elBox.innerHTML = "";
                for (const m of chat) {
                    const row = document.createElement("div");
                    row.style.display = "flex";
                    row.style.margin = "8px 0";
                    row.style.justifyContent = m.role === "user" ? "flex-end" : "flex-start";

                    const bubble = document.createElement("div");
                    bubble.style.maxWidth = "92%";
                    bubble.style.padding = "10px 12px";
                    bubble.style.borderRadius = "12px";
                    bubble.style.border = "1px solid #e5e7eb";
                    bubble.style.background = m.role === "user" ? "#111827" : "#fff";
                    bubble.style.color = m.role === "user" ? "#fff" : "#111827";
                    bubble.style.whiteSpace = "pre-wrap";
                    bubble.style.wordBreak = "break-word";
                    bubble.style.fontSize = "14px";
                    bubble.style.lineHeight = "1.35";
                    bubble.textContent = m.text;

                    row.appendChild(bubble);
                    elBox.appendChild(row);
                }
                scrollToBottom();
            }

            function save() {
                localStorage.setItem(storageKey, JSON.stringify(chat));
            }

            function add(role, text) {
                chat.push({ role, text });
                save();
                render();
            }

            async function healthCheck() {
                try {
                    const r = await fetch(`${API_BASE}/health`);
                    elStatus.textContent = r.ok ? "Online" : "Offline";
                } catch {
                    elStatus.textContent = "Offline";
                }
            }

            async function sendMessage(message) {
                add("user", message);

                elSend.disabled = true;
                elSend.textContent = "Sending…";

                try {
                    const r = await fetch(`${API_BASE}/api/chat`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message })
                    });

                    const data = await r.json().catch(() => ({}));

                    if (!r.ok) {
                        add("assistant", `Error: ${data.error || r.status}`);
                    } else {
                        add("assistant", data.answer ?? "No answer returned.");
                    }
                } catch {
                    add("assistant", "Network error. Please try again.");
                } finally {
                    elSend.disabled = false;
                    elSend.textContent = "Send";
                }
            }

            // Load previous chat
            try {
                const saved = localStorage.getItem(storageKey);
                if (saved) chat = JSON.parse(saved) || [];
            } catch { }

            if (chat.length === 0) {
                chat = [{ role: "assistant", text: "Hi — I’m My CV Copilot. Ask me anything about my experience." }];
            }

            render();
            healthCheck();

            elSend.addEventListener("click", () => {
                const msg = elInput.value.trim();
                if (!msg) return;
                elInput.value = "";
                sendMessage(msg);
            });

            elInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    elSend.click();
                }
            });

            elClear.addEventListener("click", () => {
                chat = [{ role: "assistant", text: "Chat cleared. Ask me anything about my experience." }];
                save();
                render();
            });

            document.querySelectorAll(".cvchip").forEach(btn => {
                btn.addEventListener("click", () => {
                    const q = btn.getAttribute("data-q");
                    elInput.value = q;
                    elInput.focus();
                });
            });
        }

        // Load the CV when the page loads
        window.addEventListener('load', loadCV);
    </script>
    <style>
  /* Floating button */
  #cvcopilot-fab {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: 56px;
    height: 56px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    z-index: 9999;
    background: #111827;
    color: #fff;
    box-shadow: 0 10px 25px rgba(0,0,0,.18);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #cvcopilot-fab:hover { transform: translateY(-1px); }

  /* Panel */
  #cvcopilot-panel {
    position: fixed;
    right: 18px;
    bottom: 86px;
    width: 360px;
    max-width: calc(100vw - 36px);
    height: 520px;
    max-height: calc(100vh - 110px);
    border-radius: 16px;
    border: 1px solid rgba(0,0,0,.08);
    background: #fff;
    box-shadow: 0 18px 50px rgba(0,0,0,.22);
    z-index: 9999;
    overflow: hidden;

    /* hidden by default */
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
  }
  #cvcopilot-panel.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* Header */
  .cvcopilot-header {
    padding: 12px 12px 10px 12px;
    background: #111827;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .cvcopilot-title {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .cvcopilot-title strong { font-size: 14px; line-height: 1.1; }
  .cvcopilot-title span { font-size: 12px; color: rgba(255,255,255,.75); }

  .cvcopilot-iconbtn {
    border: 1px solid rgba(255,255,255,.25);
    background: transparent;
    color: #fff;
    border-radius: 10px;
    padding: 6px 8px;
    cursor: pointer;
    font-size: 12px;
  }

  /* Chips */
  .cvcopilot-chips {
    padding: 10px 10px 0 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .cvcopilot-chip {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid #e5e7eb;
    background: #fff;
    cursor: pointer;
  }
  .cvcopilot-chip:hover { border-color: #9ca3af; }

  /* Messages */
  #cvcopilot-messages {
    padding: 10px;
    height: calc(520px - 52px - 44px - 54px); /* panel - header - chips - input area */
    max-height: calc(100vh - 110px - 52px - 44px - 54px);
    overflow: auto;
    background: #fafafa;
  }
  .cvcopilot-row { display: flex; margin: 8px 0; }
  .cvcopilot-row.user { justify-content: flex-end; }
  .cvcopilot-bubble {
    max-width: 88%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    background: #fff;
    color: #111827;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13.5px;
    line-height: 1.35;
  }
  .cvcopilot-row.user .cvcopilot-bubble {
    background: #111827;
    color: #fff;
    border-color: #111827;
  }

  /* Input area */
  .cvcopilot-input {
    padding: 10px;
    display: flex;
    gap: 8px;
    border-top: 1px solid #e5e7eb;
    background: #fff;
  }
  #cvcopilot-text {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    outline: none;
    font-size: 14px;
  }
  #cvcopilot-send {
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid #111827;
    background: #111827;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  #cvcopilot-send[disabled] {
    opacity: .65;
    cursor: not-allowed;
  }

  /* Small status dot */
  .cvcopilot-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .cvcopilot-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: #9ca3af; /* default */
  }
</style>

<!-- Floating Button -->
<button id="cvcopilot-fab" aria-label="Open My CV Copilot">
  💬
</button>

<!-- Panel -->
<div id="cvcopilot-panel" aria-hidden="true">
  <div class="cvcopilot-header">
    <div class="cvcopilot-title">
      <strong>My CV Copilot</strong>
      <span class="cvcopilot-status">
        <span id="cvcopilot-dot" class="cvcopilot-dot"></span>
        <span id="cvcopilot-status-text">Checking…</span>
      </span>
    </div>
    <div style="display:flex;gap:8px;">
      <button id="cvcopilot-clear" class="cvcopilot-iconbtn">Clear</button>
      <button id="cvcopilot-close" class="cvcopilot-iconbtn">Close</button>
    </div>
  </div>

  <div class="cvcopilot-chips">
    <button class="cvcopilot-chip" data-q="Summarize your experience in 5 bullets.">Summary</button>
    <button class="cvcopilot-chip" data-q="What are your strongest skills for Platform Engineering & Operations?">Platform</button>
    <button class="cvcopilot-chip" data-q="Describe a major production reliability challenge you handled.">SRE</button>
    <button class="cvcopilot-chip" data-q="What would you focus on in your first 90 days?">First 90 days</button>
  </div>

  <div id="cvcopilot-messages"></div>

  <div class="cvcopilot-input">
    <input id="cvcopilot-text" type="text" placeholder="Ask a question…" />
    <button id="cvcopilot-send">Send</button>
  </div>
</div>

<script>
  (function () {
    const API_BASE = "https://my-cv-copilot-api.fly.dev";
    const storageKey = "mycvcopilot_fab_chat_v1";

    const fab = document.getElementById("cvcopilot-fab");
    const panel = document.getElementById("cvcopilot-panel");
    const closeBtn = document.getElementById("cvcopilot-close");
    const clearBtn = document.getElementById("cvcopilot-clear");
    const msgBox = document.getElementById("cvcopilot-messages");
    const input = document.getElementById("cvcopilot-text");
    const sendBtn = document.getElementById("cvcopilot-send");
    const dot = document.getElementById("cvcopilot-dot");
    const statusText = document.getElementById("cvcopilot-status-text");

    let chat = [];

    function setStatus(state) {
      // state: "online" | "offline" | "checking"
      if (state === "online") {
        dot.style.background = "#22c55e";
        statusText.textContent = "Online";
      } else if (state === "offline") {
        dot.style.background = "#ef4444";
        statusText.textContent = "Offline";
      } else {
        dot.style.background = "#9ca3af";
        statusText.textContent = "Checking…";
      }
    }

    function openPanel() {
      panel.classList.add("open");
      panel.setAttribute("aria-hidden", "false");
      input.focus();
    }

    function closePanel() {
      panel.classList.remove("open");
      panel.setAttribute("aria-hidden", "true");
    }

    function scrollToBottom() {
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    function render() {
      msgBox.innerHTML = "";
      for (const m of chat) {
        const row = document.createElement("div");
        row.className = "cvcopilot-row " + (m.role === "user" ? "user" : "assistant");

        const bubble = document.createElement("div");
        bubble.className = "cvcopilot-bubble";
        bubble.textContent = m.text;

        row.appendChild(bubble);
        msgBox.appendChild(row);
      }
      scrollToBottom();
    }

    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify(chat)); } catch {}
    }

    function add(role, text) {
      chat.push({ role, text });
      save();
      render();
    }

    function load() {
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved) chat = JSON.parse(saved) || [];
      } catch {}
      if (!chat.length) {
        chat = [{ role: "assistant", text: "Hi — I’m My CV Copilot. Ask me anything about my experience." }];
      }
      render();
    }

    async function healthCheck() {
      setStatus("checking");
      try {
        const r = await fetch(`${API_BASE}/health`, { method: "GET" });
        setStatus(r.ok ? "online" : "offline");
      } catch {
        setStatus("offline");
      }
    }

    async function sendMessage(text) {
      add("user", text);
      sendBtn.disabled = true;
      sendBtn.textContent = "…";

      try {
        const r = await fetch(`${API_BASE}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          add("assistant", `Error: ${data.error || r.status}`);
        } else {
          add("assistant", data.answer ?? "No answer returned.");
        }
      } catch {
        add("assistant", "Network error. Please try again.");
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
      }
    }

    // UI events
    fab.addEventListener("click", () => {
      if (panel.classList.contains("open")) closePanel();
      else openPanel();
    });

    closeBtn.addEventListener("click", closePanel);

    clearBtn.addEventListener("click", () => {
      chat = [{ role: "assistant", text: "Chat cleared. Ask me anything about my experience." }];
      save();
      render();
    });

    sendBtn.addEventListener("click", () => {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendMessage(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendBtn.click();
      }
      if (e.key === "Escape") {
        closePanel();
      }
    });

    document.querySelectorAll(".cvcopilot-chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        const q = btn.getAttribute("data-q");
        input.value = q;
        input.focus();
      });
    });

    // Close on outside click
    document.addEventListener("click", (e) => {
      if (!panel.classList.contains("open")) return;
      const within = panel.contains(e.target) || fab.contains(e.target);
      if (!within) closePanel();
    });

    // Init
    load();
    healthCheck();
  })();
</script>

</body>

</html>
